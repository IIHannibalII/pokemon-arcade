<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokéTetris</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23fff' stroke='%23212121' stroke-width='6'/%3E%3Cpath d='M4 50 a46 46 0 0 1 92 0 z' fill='%23ee1515'/%3E%3Crect x='4' y='44' width='92' height='12' fill='%23212121'/%3E%3Ccircle cx='50' cy='50' r='14' fill='%23fff' stroke='%23212121' stroke-width='6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/theme.css?v=15">
  <link rel="stylesheet" href="tetris.css?v=15">
</head>
<body>

  <header class="game-header">
    <a class="back-link" href="../../index.html">← PokéArcade</a>
    <h1>POKéTETRIS</h1>
    <div class="header-right">
      <button id="btn-sound" class="sound-btn" title="Sound on/off (M)">🔊</button>
      <div class="pokeball" style="--size:28px" aria-hidden="true"></div>
    </div>
  </header>

  <main class="tetris-layout">

    <!-- Left panel: hold + partner mascot (both boxes are tappable) -->
    <aside class="side-panel">
      <div class="panel-box panel-box--tap" id="hold-box" title="Tap to hold / swap the piece (C)">
        <h3>HOLD <span class="tap-hint">⇆</span></h3>
        <canvas id="hold" width="120" height="90"></canvas>
      </div>
      <div class="panel-box panel-box--tap" id="partner-box" title="Tap to pause (P)">
        <h3>PARTNER <span class="tap-hint">⏸</span></h3>
        <canvas id="mascot" width="128" height="128"></canvas>
        <span class="mascot-name" id="mascot-name">PEEP · Lv.1</span>
        <div class="evo-msg" id="evo-msg"></div>
      </div>
    </aside>

    <!-- Playfield -->
    <div class="board-wrap">
      <canvas id="board" width="280" height="560"></canvas>
      <div class="fx-label" id="fx"></div>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title">POKéTETRIS</h2>
        <p id="overlay-text">Press ENTER to start</p>
        <div class="ranking-box" id="ranking-box" hidden>
          <span class="ranking-title">★ TOP CATCHES ★</span>
          <ol class="ranking" id="ranking"></ol>
        </div>
      </div>
    </div>

    <!-- Right panel: next queue + stats -->
    <aside class="side-panel">
      <div class="panel-box">
        <h3>NEXT</h3>
        <canvas id="next" width="120" height="240"></canvas>
      </div>
      <div class="panel-box">
        <h3>POKéDEX</h3>
        <div class="stat-row">
          <span class="stat-label">SCORE</span>
          <span class="stat-value" id="stat-score">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">BEST</span>
          <span class="stat-value" id="stat-best">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">LEVEL</span>
          <span class="stat-value" id="stat-level">1</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">LINES</span>
          <span class="stat-value" id="stat-lines">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">ENERGY</span>
          <div class="hp-bar"><div class="hp-fill" id="hp-fill"></div></div>
        </div>
      </div>
    </aside>

  </main>

  <!-- On-screen controls for touch devices -->
  <div class="touch-controls" id="touch-controls">
    <button type="button" data-act="hold" aria-label="Hold">HOLD</button>
    <button type="button" data-act="rotate" aria-label="Rotate">⟳</button>
    <button type="button" data-act="pause" aria-label="Pause">| |</button>
    <button type="button" data-act="left" aria-label="Move left">◀</button>
    <button type="button" data-act="down" aria-label="Soft drop">▼</button>
    <button type="button" data-act="right" aria-label="Move right">▶</button>
    <button type="button" data-act="drop" class="touch-drop" aria-label="Hard drop">⤓ DROP</button>
  </div>

  <!-- Controls reference -->
  <footer class="controls-strip">
    <span><kbd>←</kbd><kbd>→</kbd> Move</span>
    <span><kbd>↓</kbd> Soft drop</span>
    <span><kbd>↑</kbd>/<kbd>X</kbd> Rotate CW</span>
    <span><kbd>Z</kbd> Rotate CCW</span>
    <span><kbd>␣</kbd> Hard drop</span>
    <span><kbd>C</kbd> Hold</span>
    <span><kbd>P</kbd> Pause</span>
    <span><kbd>R</kbd> Restart</span>
    <span><kbd>M</kbd> Sound</span>
  </footer>

  <script src="js/engine.js?v=15"></script>
  <script src="js/sound.js?v=15"></script>
  <script src="js/mascot.js?v=15"></script>
  <script src="js/render.js?v=15"></script>
  <script src="js/main.js?v=15"></script>
</body>
</html>
